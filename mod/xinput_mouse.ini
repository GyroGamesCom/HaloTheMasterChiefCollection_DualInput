; xinput_mouse.ini - dual input proxy for Halo MCC (mouse/gyro -> right stick)
[Mouse]
; Mode: 2 = native mouse injection (gyro as real mouse look, linear, no stick curve; hooks the host input builder),
;       1 = old behaviour: mouse converted to right stick deflection (uses Sensitivity/Curve/SmoothingMs/AntiDeadzone)
Mode=2
; Mode 2: multiplier on top of the game's own mouse sensitivity
GyroSensitivity=1.0
; Mode 2: 1 = real right stick / trackpad above StickOverrideDeadzone discards gyro
TrackpadOverride=1
; 1 = mouse handling active, 0 = pure pass-through. F10 toggles at runtime.
Enabled=1
; XInput user index that receives the mouse (0 = first pad)
PadIndex=0
; mouse speed -> stick. 1.0 = ~1000 counts/s gives full deflection
Sensitivity=0.3
; response exponent: <1 boosts small moves, >1 damps them
Curve=1.0
; mouse speed is averaged over this window (ms, 5..200)
SmoothingMs=30
; added to any non-zero mouse deflection to jump over the game's radial stick deadzone (0..0.9)
AntiDeadzone=0.30
; real right stick (trackpad) above this fraction of full range overrides the mouse entirely
StickOverrideDeadzone=0.27
InvertY=0
InvertX=0
; Raw mouse packets: 0 = leave to the game, 1 = zero the deltas (buttons/wheel kept),
; 2 = drop pure-movement packets completely (GetRawInputData returns -1), else zero deltas
RawSuppress=1
; swallow WM_MOUSEMOVE of the game window during gameplay
BlockMouseMove=1
; gameplay/menu detection: 1 = flag byte in the exe (FlagRva), 2 = cursor hidden heuristic, 0 = always gameplay
MenuDetect=0
; RVA (hex) of the 'mouse locked' byte; nonzero = gameplay. Only valid for the exe build it was found in
FlagRva=0x4001b63
; write mixed_input.log next to the DLL
Log=1
